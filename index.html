<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart IV Fluid Monitoring System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .iv-bag {
            width: 140px; height: 220px; border: 4px solid #e2e8f0;
            border-radius: 40px 40px 20px 20px; position: relative;
            background-color: #f8fafc; overflow: hidden; margin: 0 auto;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05);
        }
        .iv-bag-top { width: 30px; height: 30px; border: 4px solid #e2e8f0; border-radius: 50%; margin: 0 auto -4px auto; background: white; }
        .iv-fluid { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: linear-gradient(180deg, #60a5fa 0%, #3b82f6 100%); transition: height 1s ease-in-out, background 0.5s ease; opacity: 0.85; }
        .iv-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 0; pointer-events: none; z-index: 10; }
        .iv-line { width: 20px; border-top: 2px solid #cbd5e1; margin-left: auto; margin-right: 10px; }
        .iv-tube { width: 6px; height: 60px; background-color: #e2e8f0; margin: 0 auto; }
        .glass-card { background: rgba(255, 255, 255, 0.95); border-radius: 16px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05); border: 1px solid rgba(255, 255, 255, 0.3); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen p-6">

    <div class="max-w-6xl mx-auto space-y-6">
        <header class="glass-card p-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="bg-blue-50 p-4 rounded-xl text-blue-600">
                    <i class="fa-solid fa-flask text-3xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900">Smart IV Fluid Monitoring System</h1>
                    <p class="text-slate-500 text-sm">Real-time Wireless Telemetry via ESP32 BLE Link</p>
                    <p class="text-blue-600 text-xs font-semibold mt-1">Supervised by: Dr. Othman Al-Fahad | PSMCHS</p>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="space-y-6 lg:col-span-1">
                <div class="glass-card p-6">
                    <h2 class="text-lg font-semibold mb-2">ESP32 Bluetooth Link</h2>
                    <button id="connectBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-200">
                        <i class="fa-brands fa-bluetooth"></i> <span id="btnText">Scan & Connect IV Monitor</span>
                    </button>
                    <div id="status" class="mt-3 text-center text-sm font-medium text-slate-400">Disconnected</div>
                </div>
            </div>

            <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="glass-card p-6 flex flex-col items-center justify-center">
                    <h2 class="text-lg font-semibold w-full text-left mb-6 flex items-center gap-2">
                        <i class="fa-solid fa-chart-column text-slate-400"></i> IV Fluid Visualization
                    </h2>
                    <div class="iv-container text-center">
                        <div class="iv-bag-top"></div>
                        <div class="iv-bag">
                            <div class="iv-fluid" id="fluidLevel"></div>
                            <div class="iv-lines">
                                <div class="iv-line"></div><div class="iv-line"></div>
                                <div class="iv-line"></div><div class="iv-line"></div>
                            </div>
                        </div>
                        <div class="iv-tube"></div>
                    </div>
                    <div class="mt-6 text-center">
                        <p class="text-slate-500 text-sm font-medium">Current Volume</p>
                        <p class="text-4xl font-bold text-slate-800"><span id="volumeValue">0</span> <span class="text-xl text-slate-400">mL</span></p>
                        <p class="text-blue-600 font-bold mt-1">Remaining: <span id="percentageValue">0</span>%</p>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="glass-card p-6 border-l-4 border-emerald-400 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Flow Rate</p>
                            <p class="text-3xl font-bold text-slate-800"><span id="flowRateValue">0.0</span> <span class="text-lg text-slate-500">mL/min</span></p>
                        </div>
                        <div class="w-12 h-12 bg-emerald-100 text-emerald-500 rounded-full flex items-center justify-center text-xl">
                            <i class="fa-solid fa-droplet"></i>
                        </div>
                    </div>
                    <div class="glass-card p-6 border-l-4 border-blue-400 flex items-center justify-between">
                        <div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">System Status</p>
                            <p id="systemStatusText" class="text-xl font-bold text-slate-800">Standby</p>
                        </div>
                        <div class="w-12 h-12 bg-blue-100 text-blue-500 rounded-full flex items-center justify-center text-xl">
                            <i class="fa-solid fa-microchip"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        let bleDevice, bleServer, bleService, bleCharacteristic;
        const connectBtn = document.getElementById('connectBtn');
        const btnText = document.getElementById('btnText');
        const statusDiv = document.getElementById('status');
        const fluidLevelDiv = document.getElementById('fluidLevel');
        const volumeValueSpan = document.getElementById('volumeValue');
        const percentageValueSpan = document.getElementById('percentageValue');
        const flowRateValueSpan = document.getElementById('flowRateValue');
        const systemStatusText = document.getElementById('systemStatusText');

        connectBtn.addEventListener('click', async () => {
            if (bleDevice && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
                return;
            }
            try {
                btnText.innerText = "Scanning...";
                statusDiv.innerText = "Requesting Bluetooth Device...";
                
                // التعديل الجذري: إجبار المتصفح على عرض جميع الأجهزة المحيطة
                bleDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [SERVICE_UUID]
                });
                
                bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

                statusDiv.innerText = "Connecting to Server...";
                bleServer = await bleDevice.gatt.connect();

                statusDiv.innerText = "Getting Service...";
                bleService = await bleServer.getPrimaryService(SERVICE_UUID);

                statusDiv.innerText = "Getting Characteristic...";
                bleCharacteristic = await bleService.getCharacteristic(CHARACTERISTIC_UUID);

                statusDiv.innerText = "Starting Data Stream...";
                await bleCharacteristic.startNotifications();
                bleCharacteristic.addEventListener('characteristicvaluechanged', handleNotifications);

                btnText.innerText = "Disconnect";
                connectBtn.classList.replace('bg-blue-600', 'bg-red-500');
                connectBtn.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');
                statusDiv.innerText = "Connected Successfully! (Receiving Live Data)";
                statusDiv.classList.replace('text-slate-400', 'text-emerald-500');
                systemStatusText.innerText = "Active & Monitoring";

            } catch (error) {
                console.error(error);
                btnText.innerText = "Scan & Connect IV Monitor";
                statusDiv.innerText = "Connection Failed: " + error.message;
            }
        });

        function handleNotifications(event) {
            const value = new TextDecoder('utf-8').decode(event.target.value);
            const dataArray = value.split(',');

            if (dataArray.length === 3) {
                const currentVolume = parseFloat(dataArray[0]).toFixed(0);
                const percentage = parseFloat(dataArray[1]).toFixed(1);
                const flowRate = parseFloat(dataArray[2]).toFixed(1);

                volumeValueSpan.innerText = currentVolume;
                percentageValueSpan.innerText = percentage;
                flowRateValueSpan.innerText = flowRate;

                fluidLevelDiv.style.height = percentage + '%';
                
                if(percentage <= 20.0) {
                    fluidLevelDiv.style.background = 'linear-gradient(180deg, #f87171 0%, #ef4444 100%)';
                } else {
                    fluidLevelDiv.style.background = 'linear-gradient(180deg, #60a5fa 0%, #3b82f6 100%)';
                }
            }
        }

        function onDisconnected() {
            btnText.innerText = "Scan & Connect IV Monitor";
            connectBtn.classList.replace('bg-red-500', 'bg-blue-600');
            connectBtn.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
            statusDiv.innerText = "Device Disconnected";
            statusDiv.classList.replace('text-emerald-500', 'text-slate-400');
            systemStatusText.innerText = "Standby";
            fluidLevelDiv.style.height = '0%';
            volumeValueSpan.innerText = '0';
            percentageValueSpan.innerText = '0';
            flowRateValueSpan.innerText = '0.0';
        }
    </script>
</body>
</html>
